<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangay Sampaloc Online Request</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Base & reset */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: #e9f5ec;
    color: #2c3e2f;
    padding: 20px;
  }

  h2 {
    text-align: center;
    color: #2e7d32;
    margin-bottom: 25px;
    font-size: 1.8em;
    font-weight: 700;
  }

  /* Card grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  }

  .card i {
    font-size: 36px;
    color: #43a047;
    margin-bottom: 10px;
  }

  .card h3 {
    font-size: 1.1em;
    font-weight: 500;
    color: #2e7d32;
  }

  /* Form container */
  .form-container {
    display: none;
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    max-width: 500px;
    margin: 0 auto 30px auto;
    transition: all 0.3s ease;
  }
  .form-container.active { display: block; }

  h3.form-title {
    text-align: center;
    color: #2e7d32;
    margin-bottom: 20px;
  }

  input, select {
    display: block;
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1em;
    transition: border 0.3s, box-shadow 0.3s;
  }
  input:focus, select:focus {
    border-color: #43a047;
    box-shadow: 0 0 5px #43a04750;
    outline: none;
  }

  button {
    padding: 12px;
    width: 100%;
    font-size: 1em;
    background: #43a047;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  button:hover { background: #388e3c; transform: scale(1.02); }

  /* Back button */
  .back-btn {
    display: inline-block;
    margin-bottom: 15px;
    color: #43a047;
    cursor: pointer;
    font-weight: 500;
    text-decoration: underline;
  }
  .back-btn:hover { color: #2e7d32; }

  @media(max-width: 500px){
    h2 { font-size: 1.5em; }
    .card i { font-size: 28px; }
    .card h3 { font-size: 1em; }
  }
</style>
<!-- Icon Library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<h2>Barangay Sampaloc Online Request</h2>

<div class="cards">
  <div class="card" data-target="BarangayClearance">
    <i class="fas fa-file-alt"></i>
    <h3>Barangay Clearance</h3>
  </div>
  <div class="card" data-target="CertificateOfIndigency">
    <i class="fas fa-hand-holding-heart"></i>
    <h3>Certificate of Indigency</h3>
  </div>
  <div class="card" data-target="BarangayID">
    <i class="fas fa-id-card"></i>
    <h3>Barangay ID</h3>
  </div>
  <div class="card" data-target="CertificateOfResidency">
    <i class="fas fa-home"></i>
    <h3>Certificate of Residency</h3>
  </div>
</div>

<!-- Forms -->
<div id="BarangayClearance" class="form-container">
  <span class="back-btn" onclick="goBack()">← Back</span>
  <h3 class="form-title">Barangay Clearance</h3>
  <form onsubmit="submitForm(event, 'BarangayClearance')">
    <input name="fullname" placeholder="Full Name" required>
    <input name="address" placeholder="Address" required>
    <input name="age" placeholder="Age" type="number" required>
    <input name="birthplace" placeholder="Place of Birth" required>
    <input name="purpose" placeholder="Purpose" required>
    <input name="civilstatus" placeholder="Civil Status" required>
    <button type="submit">Submit</button>
  </form>
</div>

<div id="CertificateOfIndigency" class="form-container">
  <span class="back-btn" onclick="goBack()">← Back</span>
  <h3 class="form-title">Certificate of Indigency</h3>
  <form onsubmit="submitForm(event, 'CertificateOfIndigency')">
    <input name="fullname" placeholder="Full Name" required>
    <input name="address" placeholder="Address" required>
    <input name="age" placeholder="Age" type="number" required>
    <input name="birthplace" placeholder="Place of Birth" required>
    <input name="purpose" placeholder="Purpose" required>
    <input name="civilstatus" placeholder="Civil Status" required>
    <input name="lengthofstay" placeholder="Length of Stay" required>
    <button type="submit">Submit</button>
  </form>
</div>

<div id="BarangayID" class="form-container">
  <span class="back-btn" onclick="goBack()">← Back</span>
  <h3 class="form-title">Barangay ID</h3>
  <form onsubmit="submitForm(event, 'BarangayID')">
    <input name="fullname" placeholder="Full Name" required>
    <input name="address" placeholder="Address" required>
    <input name="age" placeholder="Age" type="number" required>
    <input name="birthplace" placeholder="Place of Birth" required>
    <input name="civilstatus" placeholder="Civil Status" required>
    <button type="submit">Submit</button>
  </form>
</div>

<div id="CertificateOfResidency" class="form-container">
  <span class="back-btn" onclick="goBack()">← Back</span>
  <h3 class="form-title">Certificate of Residency</h3>
  <form onsubmit="submitForm(event, 'CertificateOfResidency')">
    <input name="fullname" placeholder="Full Name" required>
    <input name="address" placeholder="Address" required>
    <input name="age" placeholder="Age" type="number" required>
    <input name="birthplace" placeholder="Place of Birth" required>
    <input name="purpose" placeholder="Purpose" required>
    <input name="civilstatus" placeholder="Civil Status" required>
    <input name="lengthofstay" placeholder="Length of Stay" required>
    <button type="submit">Submit</button>
  </form>
</div>

<script>
  const cards = document.querySelectorAll('.card');
  const forms = document.querySelectorAll('.form-container');
  const cardGrid = document.querySelector('.cards');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const target = document.getElementById(card.dataset.target);
      forms.forEach(f => f.classList.remove('active'));
      target.classList.add('active');
      cardGrid.style.display = 'none';
    });
  });

  function goBack(){
    forms.forEach(f => f.classList.remove('active'));
    cardGrid.style.display = 'grid';
  }

  async function submitForm(e, sheet) {
    e.preventDefault();
    const form = e.target;
    const data = Array.from(form.elements)
      .filter(el => el.tagName === 'INPUT')
      .map(el => el.value);

    const payload = { sheet, values: data };

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycby0zXt15Ix5S-A0zebiaaMldrFHC66em7dnRdpLEfk_pmgUN6onrtDArfV4Xpq0JJW8/exec", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      const result = await response.json();
      if(result.result === "success"){
        alert("✅ Form submitted to " + result.sheet + " successfully!");
        form.reset();
        goBack();
      } else {
        alert("❌ Error: " + result.message);
      }
    } catch(err) {
      alert("❌ Submission failed: " + err);
    }
  }
</script>

</body>
</html>
